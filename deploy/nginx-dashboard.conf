# Serves the dashboard on the instance's public IP (no domain). Port 8888 is the one
# the security group already allows from GWU networks; the app asks for the password.
server {
    listen 8888;
    listen [::]:8888;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit needs websockets; without these the page hangs on "Connecting".
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
